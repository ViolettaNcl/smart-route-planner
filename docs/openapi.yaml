openapi: 3.0.3
info:
  title: Smart Route Planner API
  description: |
    JSON API маршрутного планировщика: геокодирование, TSP-оптимизация
    порядка точек, предсказание транспорта (MLP/Softmax), реальная
    маршрутизация по дорогам (OSRM), AI-совет по поездке, точки интереса,
    погода, план по дням (K-Means), A/B-тест моделей.

    Все POST-эндпоинты принимают `application/x-www-form-urlencoded`
    (обычные HTML-формы), а не JSON body — это сознательный выбор для
    простоты (фронтенд использует `FormData`/`URLSearchParams`, без ручной
    сериализации). Ответы — всегда JSON.

    Ни один эндпоинт не требует API-ключа для базовой работы. На Vercel
    AI-совет (`/assistant.php`) использует AI Gateway через автоматически
    обновляемый OIDC-токен; локально можно задать `AI_GATEWAY_API_KEY`,
    `ANTHROPIC_API_KEY` или `OPENAI_API_KEY`. Без них работает честный
    rule-based fallback.
  version: "3.0.0"
  license:
    name: MIT
    url: https://github.com/ViolettaNcl/smart-route-planner/blob/main/LICENSE
  contact:
    url: https://github.com/ViolettaNcl/smart-route-planner

servers:
  - url: https://smart-route-planner-violettancls-projects.vercel.app/api
    description: Живое демо на Vercel
  - url: http://localhost:8000/api
    description: Локальный запуск (php -S)

tags:
  - name: routing
    description: Расчёт и планирование маршрута
  - name: geodata
    description: Точки интереса, погода, автоподсказки
  - name: ml
    description: Объяснимость, качество, A/B-тест и безопасная очередь исправлений
  - name: ai
    description: AI-совет по поездке
  - name: ops
    description: Здоровье сервиса

paths:
  /route.php:
    post:
      tags: [routing]
      summary: Рассчитать маршрут
      description: >
        Основной эндпоинт: принимает структурированные точки или legacy-строку,
        геокодирует только точки без координат, оптимизирует промежуточный порядок
        (Nearest Neighbor + 2-opt), пытается построить реальный маршрут по
        дорогам через OSRM (с честным откатом на дистанцию по прямой),
        предсказывает транспорт, считает время/стоимость/CO2.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              anyOf:
                - required: [points]
                - required: [stops_json]
              properties:
                points:
                  type: string
                  description: Города через `;`
                  example: "Москва, Россия;Санкт-Петербург, Россия"
                stops_json:
                  type: string
                  description: JSON-массив `{id?, label, lat?, lon?}`; максимум 12 точек
                  example: '[{"label":"Berlin","lat":52.52,"lon":13.405},{"label":"Praha","lat":50.076,"lon":14.438}]'
                optimize_order:
                  type: boolean
                  default: true
                  description: Оптимизировать промежуточные точки, сохраняя старт и финиш
                fuel_price_per_liter: { type: number, nullable: true }
                fuel_consumption_l_100km: { type: number, nullable: true }
                ticket_price_per_km: { type: number, nullable: true }
                ticket_base_fare: { type: number, nullable: true }
                model_variant:
                  type: string
                  enum: [mlp, softmax]
                  nullable: true
                  description: Форсировать конкретную модель (иначе — случайно 50/50 для A/B-теста)
      responses:
        '200':
          description: Маршрут успешно рассчитан
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  points: { type: array, items: { type: string } }
                  coords:
                    type: array
                    items:
                      type: object
                      properties: { lat: { type: number }, lon: { type: number } }
                  route_stops:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }
                        lat: { type: number }
                        lon: { type: number }
                        coordinate_source: { type: string, enum: [provided, geocoded] }
                  optimized: { type: boolean }
                  distance_km: { type: number }
                  routing_source: { type: string, enum: [osrm_road, straight_line] }
                  routing_provider: { type: string }
                  route_geometry:
                    type: array
                    items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
                  duration:
                    type: object
                    properties:
                      minutes: { type: number }
                      label: { type: string }
                      exact: { type: boolean }
                  route_options:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        rank: { type: integer }
                        distance_km: { type: number }
                        driving_duration_min: { type: number, nullable: true }
                        duration: { type: object }
                        geometry: { type: array, items: { type: array, items: { type: number } } }
                        legs: { type: array, items: { type: object } }
                        navigation_available: { type: boolean }
                        cost: { type: object }
                        emissions: { type: object }
                  stops: { type: integer }
                  transport:
                    type: object
                    properties:
                      mode: { type: string, enum: [walk, car, bus] }
                      confidence: { type: number }
                      model: { type: string, enum: [mlp, softmax] }
                  cost: { type: object }
                  emissions: { type: object }
                  skipped:
                    type: array
                    items: { type: string }
                    description: Города, которые не удалось геокодировать
                  maps:
                    type: object
                    properties:
                      google: { type: string, format: uri }
                      yandex: { type: string, format: uri }
                  calculated_at: { type: string, format: date-time }
                  request_id: { type: string }
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /day_plan.php:
    post:
      tags: [routing]
      summary: Разбить уже рассчитанный маршрут по дням
      description: >
        Unsupervised K-Means (метод Ллойда) — балансирует дни по
        километражу, не переставляя города местами.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: string
                  description: "Города через `;`, в уже оптимизированном порядке"
                days: { type: integer, nullable: true, description: Если не задано — подбирается автоматически }
      responses:
        '200':
          description: План по дням построен
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  total_distance_km: { type: number }
                  days_requested: { type: integer }
                  days: { type: array, items: { type: object } }
                  algorithm: { type: string, example: kmeans_1d }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /suggest.php:
    get:
      tags: [geodata]
      summary: Поиск мест для отдельно настроенного провайдера
      description: >
        В стандартной конфигурации публичного Nominatim возвращает пустой
        список и `mode=submit_only`, потому что его policy запрещает autocomplete.
        Результаты доступны только для явно настроенного совместимого endpoint.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Список подсказок (пустой список при сбое — фича необязательная, не должна ломать форму)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  mode: { type: string, enum: [submit_only, explicit_search] }
                  provider: { type: string }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        display_name: { type: string }
                        lat: { type: number }
                        lon: { type: number }
        '429': { $ref: '#/components/responses/RateLimited' }

  /poi.php:
    post:
      tags: [geodata]
      summary: Точки интереса вдоль маршрута
      description: АЗС/кафе/рестораны/отели через Overpass API, без ключа.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [points]
              properties:
                points: { type: string }
                radius: { type: integer, minimum: 500, maximum: 10000, default: 2000 }
      responses:
        '200':
          description: Точки интереса найдены (по каждому городу отдельным ключом)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  points: { type: object, additionalProperties: { type: array, items: { type: object } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /weather.php:
    post:
      tags: [geodata]
      summary: Погода в каждой точке маршрута
      description: Open-Meteo, без ключа. Предупреждения о дожде/жаре/морозе/грозе.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [points]
              properties:
                points: { type: string }
      responses:
        '200':
          description: Прогноз получен
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  forecast:
                    type: array
                    items:
                      type: object
                      nullable: true
                      properties:
                        label: { type: string }
                        description_ru: { type: string }
                        icon: { type: string }
                        warning: { type: boolean }
                        warning_reason: { type: string, nullable: true }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /assistant.php:
    post:
      tags: [ai]
      summary: AI-совет по поездке
      description: >
        LLM (Anthropic/OpenAI, если задан ключ) или честный rule-based
        fallback без ключа — `narrative.source` показывает, что сработало.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [route]
              properties:
                route: { type: string, description: "JSON-строка с результатом /route.php" }
                weather: { type: string, description: "JSON-строка с результатом /weather.php (необязательно)" }
      responses:
        '200':
          description: Совет сгенерирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  narrative:
                    type: object
                    properties:
                      text: { type: string }
                      source: { type: string, enum: [llm, fallback] }
                      provider: { type: string, nullable: true, enum: [anthropic, openai, null] }
                  llm_configured: { type: boolean }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /decision_boundary.php:
    get:
      tags: [ml]
      summary: Карта решений модели (для графика)
      description: >
        Сетка предсказаний [дистанция × число точек] для визуализации
        границы решений (Chart.js на фронтенде).
      parameters:
        - name: model
          in: query
          required: false
          schema: { type: string, enum: [mlp, softmax], default: mlp }
      responses:
        '200':
          description: Сетка предсказаний построена
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  model: { type: string }
                  classes: { type: array, items: { type: string } }
                  stops_slices: { type: array, items: { type: integer } }
                  grid: { type: array, items: { type: object } }
                  samples: { type: array, items: { type: object } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /explain.php:
    get:
      tags: [ml]
      summary: Разбор одного конкретного предсказания
      description: "\"Почему такой транспорт\" — числовой разбор предсказания модели для одной точки [дистанция, число точек]."
      parameters:
        - name: distance_km
          in: query
          required: true
          schema: { type: number }
        - name: stops
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Объяснение построено
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  model: { type: string, enum: [mlp, softmax] }
                  explanation: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /model_insights.php:
    get:
      tags: [ml]
      summary: Персональное объяснение и сравнение моделей
      description: >
        Read-only анализ обезличенных числовых признаков: вероятности MLP и
        Softmax, согласие моделей, локальное влияние, ближайшая смена класса,
        похожие синтетические примеры, активации сети и прозрачный рейтинг
        вариантов по времени, стоимости и CO2. Адреса и координаты не
        принимаются и не обрабатываются.
      parameters:
        - name: distance_km
          in: query
          required: true
          schema: { type: number, minimum: 0.2, maximum: 1500 }
        - name: stops
          in: query
          required: true
          schema: { type: integer, minimum: 2, maximum: 12 }
        - name: model
          in: query
          schema: { type: string, enum: [mlp, softmax], default: mlp }
        - name: priority
          in: query
          schema: { type: string, enum: [balanced, fast, cheap, eco], default: balanced }
      responses:
        '200':
          description: Объяснение построено
          content:
            application/json:
              schema:
                type: object
                required: [ok, insight]
                properties:
                  ok: { type: boolean, example: true }
                  insight:
                    type: object
                    properties:
                      input: { type: object }
                      active_model: { type: string, enum: [mlp, softmax] }
                      prediction: { type: object }
                      comparison: { type: object }
                      feature_influence: { type: array, items: { type: object } }
                      counterfactuals: { type: array, items: { type: object } }
                      nearest_examples: { type: array, items: { type: object } }
                      ranking: { type: object }
                      network: { type: object }
                      privacy: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /model_quality.php:
    get:
      tags: [ml]
      summary: Отчёт качества и Model Card
      description: >
        Воспроизводимая read-only оценка включённых в релиз весов на отдельных
        validation/test-частях: confusion matrix, precision/recall/F1, log
        loss, multiclass Brier score, calibration/ECE, loss-кривые и снимки
        границы по эпохам. Результат кэшируется на 15 минут.
      responses:
        '200':
          description: Отчёт построен
          content:
            application/json:
              schema:
                type: object
                required: [ok, report]
                properties:
                  ok: { type: boolean, example: true }
                  report:
                    type: object
                    properties:
                      generated_at: { type: string, format: date-time }
                      dataset: { type: object }
                      models: { type: object }
                      training: { type: object }
                      cross_validation: { type: object }
                      model_card: { type: object }
                      feedback: { type: object }
                      release_policy: { type: object }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ab_stats.php:
    get:
      tags: [ml]
      summary: Статистика A/B-теста MLP vs Softmax
      responses:
        '200':
          description: Агрегированная статистика
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  stats:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        correct: { type: integer }
                        incorrect: { type: integer }
                        accuracy: { type: number, nullable: true }
                        total: { type: integer }
        '500': { $ref: '#/components/responses/InternalError' }

  /feedback.php:
    post:
      tags: [ml]
      summary: Отметить, угадала ли модель транспорт
      description: 👍/👎 от пользователя для варианта модели, назначенного этому визиту в A/B-тесте.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [variant, is_correct, event_id]
              properties:
                variant: { type: string, enum: [mlp, softmax] }
                is_correct: { type: string, enum: ['1', '0'] }
                event_id:
                  type: string
                  minLength: 4
                  maxLength: 128
                  description: Идентификатор route-события для дедупликации повторных голосов
      responses:
        '200':
          description: Отзыв сохранён, актуальная статистика возвращена
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  stats: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /learn.php:
    post:
      tags: [ml]
      summary: Поставить исправление модели в очередь
      description: >
        Пользователь указал правильный класс вместо текущего прогноза. Сервер
        сохраняет только обезличенные числовые признаки и хэш `event_id` в
        append-only очередь. Production-веса в HTTP-запросе не меняются:
        promotion выполняется отдельно после ручного review, anomaly checks
        и holdout release gate.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [distance_km, stops, correct_label, model_variant, event_id]
              properties:
                distance_km: { type: number, minimum: 0.2, maximum: 1500 }
                stops: { type: integer, minimum: 2, maximum: 12 }
                correct_label: { type: string, enum: [walk, car, bus] }
                model_variant:
                  type: string
                  enum: [mlp, softmax]
                  description: Вариант, предсказание которого увидел пользователь
                event_id: { type: string, minLength: 4, maxLength: 128 }
      responses:
        '200':
          description: Исправление принято в очередь или дедуплицировано
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  applied: { type: boolean, example: false }
                  queued: { type: boolean, example: true }
                  duplicate: { type: boolean }
                  queue_size: { type: integer }
                  release_policy: { type: string, example: batch_review_then_holdout_gate }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /reset_model.php:
    post:
      tags: [ml]
      summary: Административно восстановить проверенный baseline
      description: >
        Защищённая операция, отсутствующая в публичном UI. Требует настроенной
        переменной `APP_MODEL_ADMIN_TOKEN` и совпадающего заголовка.
      parameters:
        - name: X-Model-Admin-Token
          in: header
          required: true
          schema: { type: string, format: password }
      responses:
        '200':
          description: Веса сброшены
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  model: { type: string }
                  model_version: { type: string }
        '403':
          description: Admin token отсутствует, не настроен или не совпадает
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /health.php:
    get:
      tags: [ops]
      summary: Health-check
      description: >
        Для аптайм-мониторинга и Docker HEALTHCHECK. Не дёргает внешние
        сервисы (Nominatim/OSRM) — только проверяет веса модели и
        доступность var/ на запись.
      responses:
        '200':
          description: Сервис здоров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Что-то не так (веса модели повреждены или var/ не пишется)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        ok: { type: boolean }
        service: { type: string }
        version: { type: string }
        environment: { type: string }
        checks:
          type: object
          properties:
            model_weights: { type: boolean }
            model_training_report: { type: boolean }
            runtime_storage_writable: { type: boolean }
        providers: { type: object }
        capabilities: { type: object }
        php_version: { type: string }
        timestamp: { type: string, format: date-time }

    ErrorResponse:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error: { type: string, description: Человекочитаемое сообщение (на русском) }
        error_code: { type: string, description: Машиночитаемый код для локализации на фронтенде }

  responses:
    ValidationError:
      description: Некорректный ввод (например, меньше двух валидных точек маршрута)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: JSON списка точек превышает безопасный предел 32 KiB
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Превышен лимит запросов (token bucket)
      headers:
        Retry-After:
          schema: { type: integer }
          description: Через сколько секунд можно повторить запрос
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  retry_after_seconds: { type: integer }
    InternalError:
      description: Внутренняя ошибка сервера (подробности только в логах, не в ответе)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
