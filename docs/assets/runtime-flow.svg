<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="310" viewBox="0 0 1400 310" role="img" aria-labelledby="t d">
<title id="t">Runtime request flow</title><desc id="d">Request flow from browser through front controller and application services to providers and fallbacks.</desc>
<defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient><style>.box{fill:#0f172a;stroke:#334155;stroke-width:1.4}.head{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700}.sub{fill:#94a3b8;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.flow{stroke-dasharray:8 12;animation:move 2.4s linear infinite}.fallback{stroke-dasharray:4 10;animation:move 3.4s linear infinite}@keyframes move{to{stroke-dashoffset:-80}}@media (prefers-reduced-motion: reduce){.flow,.fallback{animation:none}}</style></defs>
<rect width="1400" height="310" rx="24" fill="#08111f"/>
<path d="M220 145H330M540 145H650M860 145H970" stroke="url(#line)" stroke-width="4" class="flow"/><path d="M1075 198C1075 255 1205 255 1205 210" fill="none" stroke="#64748b" stroke-width="2.5" class="fallback"/>
<g transform="translate(42 92)"><rect class="box" width="178" height="106" rx="18"/><text class="head" x="20" y="42">Browser / PWA</text><text class="sub" x="20" y="70">route editor</text><text class="sub" x="20" y="88">MapLibre UI</text></g>
<g transform="translate(330 92)"><rect class="box" width="210" height="106" rx="18"/><text class="head" x="20" y="42">Front Controller</text><text class="sub" x="20" y="70">api/index.php</text><text class="sub" x="20" y="88">15 endpoints</text></g>
<g transform="translate(650 92)"><rect class="box" width="210" height="106" rx="18"/><text class="head" x="20" y="42">Application</text><text class="sub" x="20" y="70">RoutePlanner</text><text class="sub" x="20" y="88">ML + geodata</text></g>
<g transform="translate(970 92)"><rect class="box" width="210" height="106" rx="18"/><text class="head" x="20" y="42">Providers</text><text class="sub" x="20" y="70">OSRM / Nominatim</text><text class="sub" x="20" y="88">Weather / POI / LLM</text></g>
<g transform="translate(1188 210)"><rect class="box" width="174" height="70" rx="16"/><text class="head" x="18" y="30" font-size="16">Fallbacks</text><text class="sub" x="18" y="52">degrade, don't hide</text></g>
<circle cx="267" cy="145" r="5" fill="#a78bfa"><animate attributeName="cx" values="230;320" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="590" cy="145" r="5" fill="#7dd3fc"><animate attributeName="cx" values="550;640" dur="1.8s" begin=".4s" repeatCount="indefinite"/></circle><circle cx="912" cy="145" r="5" fill="#5eead4"><animate attributeName="cx" values="870;960" dur="1.8s" begin=".8s" repeatCount="indefinite"/></circle>
<text x="42" y="45" class="sub" font-size="13" letter-spacing="2">REQUEST PIPELINE / GRACEFUL DEGRADATION</text>
</svg>
