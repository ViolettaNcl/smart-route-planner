<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">Smart Route Planner</title>
<desc id="desc">Animated technical banner showing an optimized route across a dark map-like interface.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".52" stop-color="#0b1530"/><stop offset="1" stop-color="#10162d"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset=".46" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#67e8f9" stop-opacity=".7"/><stop offset=".55" stop-color="#7c3aed" stop-opacity=".2"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#93c5fd" stroke-opacity=".06"/></pattern>
  <path id="route" d="M790 353 C858 310 900 337 952 286 S1042 188 1111 215 S1198 329 1284 218" fill="none"/>
  <style>
    .muted{fill:#8ea3c0;font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .routeDash{stroke-dasharray:8 15;animation:dash 3.4s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.3s ease-in-out infinite}.fade{animation:fade 4.8s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-92}}@keyframes pulse{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.28);opacity:1}}@keyframes fade{0%,100%{opacity:.46}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.routeDash,.pulse,.fade{animation:none!important}}
  </style>
</defs>
<rect width="1400" height="520" rx="28" fill="url(#bg)"/><rect width="1400" height="520" rx="28" fill="url(#grid)"/>
<circle cx="1190" cy="72" r="210" fill="url(#glow)" filter="url(#blur)" opacity=".42"/><circle cx="132" cy="470" r="210" fill="url(#glow)" filter="url(#blur)" opacity=".24"/>
<g transform="translate(74 72)">
  <rect width="595" height="376" rx="28" fill="#0c1728" fill-opacity=".83" stroke="#94a3b8" stroke-opacity=".16" filter="url(#shadow)"/>
  <circle cx="34" cy="31" r="5" fill="#fb7185"/><circle cx="52" cy="31" r="5" fill="#fbbf24"/><circle cx="70" cy="31" r="5" fill="#34d399"/>
  <text x="98" y="36" class="muted mono" font-size="13" letter-spacing="2">SMART-ROUTE / SYSTEM</text>
  <text x="34" y="104" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="750">Smart Route Planner</text>
  <rect x="34" y="126" width="474" height="4" rx="2" fill="url(#accent)"/>
  <text x="34" y="172" class="muted" font-size="18">Optimization that degrades gracefully.</text><text x="34" y="202" class="muted" font-size="18">ML that exposes its reasoning.</text>
  <g transform="translate(34 244)">
    <rect width="160" height="72" rx="16" fill="#111f36" stroke="#38bdf8" stroke-opacity=".25"/><text x="18" y="28" fill="#7dd3fc" class="mono" font-size="12">ROUTING</text><text x="18" y="52" fill="#eef6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">OSRM + fallback</text>
    <rect x="174" width="160" height="72" rx="16" fill="#111f36" stroke="#a78bfa" stroke-opacity=".25"/><text x="192" y="28" fill="#c4b5fd" class="mono" font-size="12">OPTIMIZER</text><text x="192" y="52" fill="#eef6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">NN + 2-opt</text>
    <rect x="348" width="178" height="72" rx="16" fill="#111f36" stroke="#34d399" stroke-opacity=".25"/><text x="366" y="28" fill="#6ee7b7" class="mono" font-size="12">ML</text><text x="366" y="52" fill="#eef6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">MLP + Softmax</text>
  </g>
</g>
<g>
  <text x="782" y="91" class="muted mono" font-size="12" letter-spacing="2">LIVE ROUTE PIPELINE</text>
  <path d="M777 145 C853 119 915 131 965 104 S1094 82 1160 112 S1260 159 1328 120" fill="none" stroke="#93c5fd" stroke-opacity=".12" stroke-width="1.5"/>
  <use href="#route" stroke="#17253d" stroke-width="18" stroke-linecap="round"/><use href="#route" stroke="url(#accent)" stroke-width="5.5" stroke-linecap="round"/><use href="#route" stroke="#e0f2fe" stroke-opacity=".65" stroke-width="1.5" class="routeDash"/>
  <g fill="#0b1324" stroke-width="4"><circle cx="790" cy="353" r="11" stroke="#7c3aed"/><circle cx="952" cy="286" r="11" stroke="#38bdf8"/><circle cx="1111" cy="215" r="11" stroke="#34d399"/><circle cx="1284" cy="218" r="11" stroke="#f8fafc"/></g>
  <g fill="none" stroke="#67e8f9" opacity=".46"><circle cx="952" cy="286" r="22" class="pulse"/><circle cx="1111" cy="215" r="22" class="pulse" style="animation-delay:.8s"/></g>
  <circle r="7" fill="#fff"><animateMotion dur="4.3s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
  <g transform="translate(780 426)"><rect width="560" height="58" rx="16" fill="#0c1728" fill-opacity=".88" stroke="#94a3b8" stroke-opacity=".14"/><text x="19" y="24" class="muted mono" font-size="11">REQUEST STATUS</text><circle cx="22" cy="40" r="4" fill="#34d399" class="fade"/><text x="34" y="44" fill="#d9fce9" class="mono" font-size="12">route → enrich → explain → verify</text><text x="405" y="40" fill="#7dd3fc" class="mono" font-size="11">RESILIENT</text></g>
</g>
<text x="74" y="490" class="muted mono" font-size="11" letter-spacing="1.5">PHP · MAPLIBRE · OSRM · NOMINATIM · OPEN-METEO · OVERPASS · PLAYWRIGHT · VERCEL · DOCKER</text>
</svg>
