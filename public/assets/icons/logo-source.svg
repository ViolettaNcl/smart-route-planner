<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <defs>
        <linearGradient id="bg" x1="3" y1="3" x2="45" y2="45" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ddd6fe" />
            <stop offset="30%" stop-color="#a78bfa" />
            <stop offset="68%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#4c1d95" />
        </linearGradient>
        <linearGradient id="rim" x1="3" y1="3" x2="45" y2="45" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
    </defs>

    <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#bg)" />
    <rect x="2.6" y="2.6" width="42.8" height="42.8" rx="12.4" fill="none" stroke="url(#rim)" stroke-width="1.4" />

    <!-- жирная дорога-маршрут: читается даже 16x16 в вкладке браузера -->
    <path d="M11 34 C 16 24, 20 32, 24 22 S 32 12, 37 14"
        fill="none" stroke="#ffffff" stroke-width="5.4"
        stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="11" cy="34" r="4" fill="#ffffff" />
    <circle cx="37" cy="14" r="5.2" fill="#ffffff" />
    <circle cx="37" cy="14" r="5.2" fill="none" stroke="#7c3aed" stroke-width="2" />
</svg>
