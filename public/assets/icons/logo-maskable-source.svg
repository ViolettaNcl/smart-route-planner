<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ddd6fe" />
            <stop offset="30%" stop-color="#a78bfa" />
            <stop offset="68%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#4c1d95" />
        </linearGradient>
    </defs>

    <!-- full-bleed фон без скруглений и прозрачности: maskable-иконку ОС может
         обрезать в любую форму (круг, squircle...), прозрачные углы были бы видны -->
    <rect x="0" y="0" width="48" height="48" fill="url(#bg)" />

    <!-- глиф уменьшен и сдвинут к центру, чтобы остаться в "safe zone" ~80% -->
    <path d="M14.5 32 C 18.5 24.5, 21.5 30.5, 24.5 23.5 S 30.5 16, 34 17.5"
        fill="none" stroke="#ffffff" stroke-width="4.3"
        stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="14.5" cy="32" r="3.2" fill="#ffffff" />
    <circle cx="34" cy="17.5" r="4.1" fill="#ffffff" />
    <circle cx="34" cy="17.5" r="4.1" fill="none" stroke="#7c3aed" stroke-width="1.6" />
</svg>
