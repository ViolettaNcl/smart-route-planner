AliasMatch "^/api/[A-Za-z_]+\.php$" "/var/www/html/api/index.php"

<Directory "/var/www/html/api">
    Require all granted
</Directory>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on' || (osenv('RENDER') == 'true' && req('X-Forwarded-Proto') == 'https')"

<LocationMatch "^/api/">
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "no-store"
</LocationMatch>

<Location "/service-worker.js">
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "public, max-age=0, must-revalidate"
</Location>
